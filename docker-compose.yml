version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mazeed-app
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:rkUG6uFvMvMtmcXiCXYnwJz7hdHutWRMYrkq5I5RawQ=
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=mazid
      - DB_USERNAME=mazeed_user
      - DB_PASSWORD=mazeed_password
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT=http://localhost:8000/auth/linkedin/callback
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      - db
    networks:
      - mazeed

  db:
    image: mysql:8.0
    container_name: mazeed-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mazid
      MYSQL_USER: mazeed_user
      MYSQL_PASSWORD: mazeed_password
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mazeed
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mazeed-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: mazeed_user
      PMA_PASSWORD: mazeed_password
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - mazeed

volumes:
  db_data:
    driver: local

networks:
  mazeed:
    driver: bridge
