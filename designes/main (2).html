<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>::-webkit-scrollbar { display: none;}</style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mint': {
                            50: '#f0fdf6',
                            100: '#dcfce9',
                            200: '#bbf7d6',
                            300: '#86efb8',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        'tajawal': ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-tajawal">
    <div id="app-container" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header id="header" class="bg-white shadow-sm">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <!-- Logo -->
                <span class="flex items-center cursor-pointer">
                    <img src="https://i.postimg.cc/15B2BWyF/Chat-GPT-Image-Aug-5-2025-06-14-20-PM.png" alt="شعار مزيد" class="h-10">
                </span>
                
                <!-- Navigation -->
                <nav class="hidden md:flex space-x-1 space-x-reverse">
                    <span class="px-3 py-2 text-gray-600 hover:text-mint-600 transition-colors duration-200 cursor-pointer">الرئيسية</span>
                    <span class="px-3 py-2 text-gray-600 hover:text-mint-600 transition-colors duration-200 cursor-pointer">استكشاف الفرص</span>
                    <span class="px-3 py-2 text-mint-600 font-bold cursor-pointer">إضافة فرصة</span>
                    <span class="px-3 py-2 text-gray-600 hover:text-mint-600 transition-colors duration-200 cursor-pointer">المتطوعون</span>
                </nav>
                
                <!-- User Menu -->
                <div class="flex items-center space-x-3 space-x-reverse">
                    <button class="text-gray-600 hover:text-mint-600 p-2">
                        <i class="fa-regular fa-bell text-xl"></i>
                    </button>
                    <div class="relative">
                        <button class="flex items-center space-x-2 space-x-reverse focus:outline-none">
                            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" alt="صورة المستخدم" class="w-9 h-9 rounded-full border-2 border-mint-200">
                            <span class="hidden md:block text-gray-700">أحمد محمد</span>
                            <i class="fa-solid fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main id="main-content" class="flex-grow container mx-auto px-4 py-8">
            <div id="add-role-form" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-8">
                <!-- Form Header -->
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">إضافة دور جديد</h1>
                    <p class="text-gray-600">أضف تفاصيل الدور التطوعي الذي تبحث عنه لمشروعك</p>
                </div>
                
                <!-- Form Fields -->
                <form id="role-form">
                    <!-- Project/Organization Name -->
                    <div class="mb-6">
                        <label for="project-name" class="block text-gray-700 font-bold mb-2">اسم المشروع / المنظمة</label>
                        <input type="text" id="project-name" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-mint-400 focus:border-transparent transition-all duration-200" placeholder="أدخل اسم المشروع أو المنظمة">
                    </div>
                    
                    <!-- Job Title -->
                    <div class="mb-6">
                        <label for="job-title" class="block text-gray-700 font-bold mb-2">المسمى الوظيفي</label>
                        <input type="text" id="job-title" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-mint-400 focus:border-transparent transition-all duration-200" placeholder="مثال: مصمم جرافيك، مطور ويب، مدير مشروع">
                    </div>
                    
                    <!-- Role Description -->
                    <div class="mb-6">
                        <label for="role-description" class="block text-gray-700 font-bold mb-2">وصف الدور</label>
                        <textarea id="role-description" rows="5" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-mint-400 focus:border-transparent transition-all duration-200" placeholder="اشرح تفاصيل الدور والمسؤوليات المطلوبة"></textarea>
                    </div>
                    
                    <!-- Required Skills -->
                    <div class="mb-6">
                        <label for="skills" class="block text-gray-700 font-bold mb-2">المهارات المطلوبة</label>
                        <div class="relative">
                            <input type="text" id="skills" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-mint-400 focus:border-transparent transition-all duration-200" placeholder="أضف مهارة واضغط Enter">
                            <i class="fa-solid fa-plus absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                        
                        <!-- Tags Display -->
                        <div id="skills-tags" class="flex flex-wrap gap-2 mt-3">
                            <div class="bg-mint-50 text-mint-700 px-3 py-1 rounded-full flex items-center">
                                تصميم جرافيك
                                <button type="button" class="mr-1 text-mint-500 hover:text-mint-700">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div class="bg-mint-50 text-mint-700 px-3 py-1 rounded-full flex items-center">
                                Adobe Photoshop
                                <button type="button" class="mr-1 text-mint-500 hover:text-mint-700">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div class="bg-mint-50 text-mint-700 px-3 py-1 rounded-full flex items-center">
                                تصميم شعارات
                                <button type="button" class="mr-1 text-mint-500 hover:text-mint-700">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Contact Link -->
                    <div class="mb-8">
                        <label for="contact-link" class="block text-gray-700 font-bold mb-2">رابط للتواصل</label>
                        <div class="flex">
                            <select id="contact-type" class="px-4 py-3 rounded-r-xl border border-l-0 border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-mint-400 focus:border-transparent transition-all duration-200">
                                <option value="linkedin">LinkedIn</option>
                                <option value="whatsapp">WhatsApp</option>
                                <option value="email">البريد الإلكتروني</option>
                            </select>
                            <input type="text" id="contact-link" class="flex-grow px-4 py-3 rounded-l-xl border border-r-0 border-gray-300 focus:outline-none focus:ring-2 focus:ring-mint-400 focus:border-transparent transition-all duration-200" placeholder="أدخل رابط أو معلومات التواصل">
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <div class="flex justify-center">
                        <button type="button" id="submit-btn" class="bg-mint-500 hover:bg-mint-600 text-white font-bold py-3 px-8 rounded-xl transition-all duration-200 flex items-center" onclick="showSuccessMessage()">
                            <i class="fa-solid fa-paper-plane ml-2"></i>
                            نشر الدور
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Success Message (Initially Hidden) -->
            <div id="success-message" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-8 mt-6 hidden">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-mint-100 text-mint-600 mb-4">
                        <i class="fa-solid fa-check text-2xl"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">تم نشر الدور بنجاح!</h2>
                    <p class="text-gray-600 mb-6">يمكنك الآن مشاركة هذه الفرصة على منصات التواصل الاجتماعي</p>
                    
                    <div class="flex justify-center mb-6">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-200 flex items-center">
                            <i class="fa-brands fa-linkedin ml-2"></i>
                            مشاركة على LinkedIn
                        </button>
                    </div>
                    
                    <div class="flex justify-center space-x-4 space-x-reverse">
                        <button class="text-mint-600 hover:text-mint-700 font-bold py-2 px-4 transition-all duration-200" onclick="hideSuccessMessage()">
                            العودة للصفحة الرئيسية
                        </button>
                        <button class="text-gray-600 hover:text-gray-800 font-bold py-2 px-4 transition-all duration-200" onclick="hideSuccessMessage()">
                            إضافة دور آخر
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        function showSuccessMessage() {
            document.getElementById('add-role-form').classList.add('hidden');
            document.getElementById('success-message').classList.remove('hidden');
        }
        
        function hideSuccessMessage() {
            document.getElementById('success-message').classList.add('hidden');
            document.getElementById('add-role-form').classList.remove('hidden');
        }
        
        // Handle skills tags
        document.getElementById('skills').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const skill = this.value.trim();
                if (skill) {
                    const skillsContainer = document.getElementById('skills-tags');
                    const skillTag = document.createElement('div');
                    skillTag.className = 'bg-mint-50 text-mint-700 px-3 py-1 rounded-full flex items-center';
                    skillTag.innerHTML = `
                        ${skill}
                        <button type="button" class="mr-1 text-mint-500 hover:text-mint-700">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                    skillsContainer.appendChild(skillTag);
                    this.value = '';
                    
                    // Add event listener to remove button
                    const removeBtn = skillTag.querySelector('button');
                    removeBtn.addEventListener('click', function() {
                        skillTag.remove();
                    });
                }
            }
        });
        
        // Add event listeners to existing remove buttons
        document.querySelectorAll('#skills-tags button').forEach(button => {
            button.addEventListener('click', function() {
                this.parentElement.remove();
            });
        });
    </script>
</body>
</html>
